<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style/style.css" media="screen">
    <link rel="stylesheet" href="style/print.css" media="print">

    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    <title>Governita</title>
</head>
<body>
    <header id="header">
        <div id="logo">
            <img id="img_logo" src="img/logo-governita-sf.png" alt="Governita" class="responsive">
        </div>
        <div id="language_selector">
            <button class="language" onclick="request_button('bebidas',2); request_button('menu',2);" aria-label="Portugues">PT</button>
            <span class="lang-divider"></span>
            <button class="language" onclick="request_button('bebidas',3); request_button('menu',3);" aria-label="English">EN</button>
        </div>
    </header>

    <main id="main">
        <section id="menu" class="menu-section loading">
            <div class="section-header">
                <div class="ornament"></div>
                <h2>MENU</h2>
                <div class="ornament"></div>
            </div>
            <div class="loader"><span></span><span></span><span></span></div>
            <ul id="menu_list"></ul>
        </section>

        <section id="bebidas" class="menu-section loading">
            <div class="section-header">
                <div class="ornament"></div>
                <h2 id="portuguese">BEBIDAS</h2>
                <h2 id="english" style="display: none;">DRINKS</h2>
                <div class="ornament"></div>
            </div>
            <div class="loader"><span></span><span></span><span></span></div>
            <ul id="bebidas_list"></ul>
        </section>
    </main>

    <footer id="footer">
        <div class="footer-ornament"></div>
        <div class="footer-links">
            <a href="https://www.facebook.com" target="_blank" rel="noopener" aria-label="Facebook">
                <img src="img/facebook.png" alt="Facebook">
            </a>
            <a href="https://www.instagram.com" target="_blank" rel="noopener" aria-label="Instagram">
                <img src="img/instagram.png" alt="Instagram">
            </a>
            <a href="mailto:info@governita.com" aria-label="Email">
                <img src="img/email.png" alt="Email">
            </a>
            <a href="tel:+351000000000" aria-label="Telefone">
                <img src="img/tel.png" alt="Telefone">
            </a>
        </div>
        <p class="footer-text">Governita</p>
    </footer>

    <script src="src/script.js"></script>
</body>
</html>
